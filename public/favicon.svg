<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- the mark (src/components/Mark.astro), simplified to read at 16px: the
       lozenge, its axis and horizon, gold at the head and lapis below -->
  <defs><clipPath id="l"><path d="M50,4 L96,50 L50,96 L4,50 Z"/></clipPath></defs>
  <g clip-path="url(#l)">
    <rect width="100" height="100" fill="#f6f3ea"/>
    <rect x="50" width="50" height="40" fill="#e8b93f"/>
    <rect y="40" width="50" height="60" fill="#1d4f9b"/>
    <line x1="50" y1="0" x2="50" y2="100" stroke="#22252b" stroke-width="4"/>
    <line x1="0" y1="40" x2="100" y2="40" stroke="#22252b" stroke-width="4"/>
  </g>
  <path d="M50,4 L96,50 L50,96 L4,50 Z" fill="none" stroke="#22252b" stroke-width="4"/>
</svg>
